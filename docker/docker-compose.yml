services:
  redis:
    image: ${REDIS_IMAGE:-redis:7.4-alpine}
    container_name: ${COMPOSE_PROJECT_NAME:-app}-redis
    restart: unless-stopped
    labels:
      environment: ${APP_ENV:-Development}
    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:${REDIS_PORT:-6379}:6379"
    user: redis
    # Password is written to a private temp config file, so it doesn't appear
    # on the process command line (ps / docker inspect Cmd).
    command:
      - sh
      - -c
      - |
        umask 077
        printf 'requirepass "%s"\n' "$$REDIS_PASSWORD" > /tmp/redis-secrets.conf
        exec redis-server /tmp/redis-secrets.conf --appendonly yes --maxmemory "$$REDIS_MAXMEMORY" --maxmemory-policy "$$REDIS_MAXMEMORY_POLICY"
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?Set REDIS_PASSWORD in your env file}
      REDISCLI_AUTH: ${REDIS_PASSWORD}
      REDIS_MAXMEMORY: ${REDIS_MAXMEMORY:-128mb}
      REDIS_MAXMEMORY_POLICY: ${REDIS_MAXMEMORY_POLICY:-allkeys-lru}
    volumes:
      - redis_data:/data
    networks:
      - backend
    mem_limit: ${REDIS_MEM_LIMIT:-192m}
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s
    stop_grace_period: 30s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  mssql:
    image: ${MSSQL_IMAGE:-mcr.microsoft.com/mssql/server:2022-latest}
    container_name: ${COMPOSE_PROJECT_NAME:-app}-mssql
    restart: unless-stopped
    labels:
      environment: ${APP_ENV:-Development}
    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:${MSSQL_PORT:-1433}:1433"
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD:?Set MSSQL_SA_PASSWORD in your env file}
      MSSQL_PID: ${MSSQL_PID:-Express}
      MSSQL_MEMORY_LIMIT_MB: ${MSSQL_MEMORY_LIMIT_MB:-1024}
    volumes:
      - mssql_data:/var/opt/mssql
    networks:
      - backend
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test:
        - CMD-SHELL
        - /opt/mssql-tools18/bin/sqlcmd -C -S localhost -U sa -P "$$MSSQL_SA_PASSWORD" -Q "SELECT 1" -b -o /dev/null
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 60s
    stop_grace_period: 60s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  nginx:
    image: ${NGINX_IMAGE:-nginx:1.27-alpine}
    container_name: ${COMPOSE_PROJECT_NAME:-app}-nginx
    restart: unless-stopped
    labels:
      environment: ${APP_ENV:-Development}
    command:
      - /bin/sh
      - -c
      - (while :; do sleep 21600; nginx -s reload; done) & exec nginx -g 'daemon off;'
    ports:
      - "${NGINX_BIND_ADDRESS:-127.0.0.1}:${NGINX_HTTP_PORT:-8080}:80"
      - "${NGINX_BIND_ADDRESS:-127.0.0.1}:${NGINX_HTTPS_PORT:-8443}:443"
        # Admin panel gets its own HTTPS port (an IP address has no hostname/SNI to tell the two apps apart)
      - "${NGINX_BIND_ADDRESS:-127.0.0.1}:${ADMIN_HTTPS_PORT:-9443}:8443"
    configs:
      - source: nginx_conf
        target: /etc/nginx/nginx.conf
      - source: nginx_proxy
        target: /etc/nginx/snippets/proxy.conf
      - source: nginx_site_${NGINX_MODE:-dev}
        target: /etc/nginx/conf.d/default.conf
    volumes:
      - letsencrypt:/etc/letsencrypt:ro
      - certbot_www:/var/www/certbot:ro
    networks:
      - edge
    mem_limit: ${NGINX_MEM_LIMIT:-128m}
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/nginx-health"]
      interval: 15s
      timeout: 3s
      retries: 3
      start_period: 10s
    stop_grace_period: 15s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  certbot:
    image: ${CERTBOT_IMAGE:-certbot/certbot:v5.8.0}   # 5.4+ needed for IP-address certificates
    container_name: ${COMPOSE_PROJECT_NAME:-app}-certbot
    profiles: ["prod"]
    restart: unless-stopped
    labels:
      environment: ${APP_ENV:-Development}
    entrypoint:
      - /bin/sh
      - -c
      - trap exit TERM; while :; do certbot renew --webroot -w /var/www/certbot --quiet; sleep 12h & wait $${!}; done
    volumes:
      - letsencrypt:/etc/letsencrypt
      - certbot_www:/var/www/certbot
    mem_limit: 128m
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  webapi:
    image: ${DOCKERHUB_NAMESPACE:?set DOCKERHUB_NAMESPACE}/${DOCKERHUB_REPO:?set DOCKERHUB_REPO}:${IMAGE_TAG:?set IMAGE_TAG}
    # Uncomment to build locally instead of pulling (path to the solution folder that holds the Dockerfile):
    # build:
    #   context: ../../../../../.net/ms/DotNet/AdminPanel/admin-panel.net-2025
    #   dockerfile: Dockerfile
    container_name: ${COMPOSE_PROJECT_NAME:-app}-webapi
    restart: unless-stopped
    init: true
    stop_grace_period: 30s
    labels:
      environment: ${APP_ENV:-Development}
    depends_on:
      mssql:
        condition: service_healthy
      redis:
        condition: service_healthy
    # Explicit list on purpose (no env_file): the app must NOT receive the Redis/SQL admin passwords.
    environment:
      ASPNETCORE_ENVIRONMENT: ${APP_ENV:-Production}
      ConnectionStrings__DefaultConnection: ${ConnectionStrings__DefaultConnection:?set ConnectionStrings__DefaultConnection in your env file}
      # One-off seeding of the first admin user: remove this line after seeding.
      Seed__AdminPassword: ${SEED_ADMIN_PASSWORD:-}
      Redis__Enabled: ${APP_REDIS_ENABLED:-false}
      Redis__Server: redis:6379,password=${REDIS_PASSWORD}
      FilePaths__LogFileRootDirectory: /app/logs
      DataProtection__KeysDirectory: /app/keys
      # nginx reaches the app from the Docker bridge range
      ForwardedHeaders__KnownNetworks: ${FORWARDED_KNOWN_NETWORKS:-172.16.0.0/12}
    volumes:
      - webapi_logs:/app/logs
      - webapi_keys:/app/keys
    networks:
      backend: {}
      edge:
        aliases:
          - neutralhire-admin
    read_only: true
    tmpfs:
      - /tmp:size=64m,noexec,nosuid
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 256
    mem_limit: ${WEBAPI_MEM_LIMIT:-768m}
    cpus: ${WEBAPI_CPUS:-1.0}
    healthcheck:
      # /health/live only checks the process (no DB), so a DB blip never restarts the app.
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/8080 && printf 'GET /health/live HTTP/1.0\\r\\nHost: localhost\\r\\n\\r\\n' >&3 && head -n1 <&3 | grep -q ' 200 '"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 40s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
networks:
  backend:
    name: ${COMPOSE_PROJECT_NAME:-app}-backend
  edge:            # NeutralHire apps join this network (compose.edge.yaml)
    name: ${COMPOSE_PROJECT_NAME:-app}-edge
volumes:
  redis_data:
  mssql_data:
  letsencrypt:
  certbot_www:
  webapi_logs:
  webapi_keys:


configs:
  nginx_conf:
    content: |
      user nginx;
      worker_processes auto;
      error_log /var/log/nginx/error.log warn;
      pid /var/run/nginx.pid;
      events { worker_connections 2048; }
      http {
        include /etc/nginx/mime.types;
        default_type application/octet-stream;
        server_tokens off;
        sendfile on;
        keepalive_timeout 65;
        client_max_body_size 10m;
        # $$uri (not $$request): query strings may carry payment tokens, keep them out of logs
        log_format main '$$remote_addr [$$time_local] "$$request_method $$uri" $$status $$body_bytes_sent host=$$host rt=$$request_time';
        access_log /var/log/nginx/access.log main;
        gzip on;
        gzip_proxied any;
        gzip_types text/plain text/css application/json application/javascript application/xml image/svg+xml;
        resolver 127.0.0.11 valid=10s ipv6=off;   # Docker DNS; nginx starts even if apps are down
        map $$http_upgrade $$connection_upgrade { default upgrade; '' close; }
        limit_req_zone $$binary_remote_addr zone=login:10m rate=10r/m;
        limit_req_status 429;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        include /etc/nginx/conf.d/*.conf;
      }

  nginx_proxy:
    content: |
      proxy_http_version 1.1;
      proxy_set_header Host $$host;
      proxy_set_header X-Real-IP $$remote_addr;
      proxy_set_header X-Forwarded-For $$proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $$scheme;
      proxy_set_header X-Forwarded-Host $$host;
      proxy_set_header Upgrade $$http_upgrade;
      proxy_set_header Connection $$connection_upgrade;
      proxy_connect_timeout 5s;
      proxy_read_timeout 60s;
      proxy_buffer_size 16k;
      proxy_buffers 8 16k;
      proxy_busy_buffers_size 32k;

  nginx_site_dev:
    content: |
      server {
        listen 80 default_server;
        location = /nginx-health { access_log off; return 200 "ok\n"; }
        location /.well-known/acme-challenge/ { root /var/www/certbot; }
        location / { return 404; }
      }
      server {
        listen 80;
        server_name ${SHOP_DOMAIN:-shop.localhost};
        location /.well-known/acme-challenge/ { root /var/www/certbot; }
        set $$upstream ${SHOP_UPSTREAM:-http://neutralhire-ecommerce:8080};
        location / { proxy_pass $$upstream; include /etc/nginx/snippets/proxy.conf; }
      }
      server {
        listen 80;
        server_name ${ADMIN_DOMAIN:-admin.localhost};
        set $$upstream ${ADMIN_UPSTREAM:-http://neutralhire-admin:8080};
        location /.well-known/acme-challenge/ { root /var/www/certbot; }
        location / { proxy_pass $$upstream; include /etc/nginx/snippets/proxy.conf; }
      }

  nginx_site_prod:
    content: |
      ssl_certificate     /etc/letsencrypt/live/${CERT_NAME:-neutralhire}/fullchain.pem;
      ssl_certificate_key /etc/letsencrypt/live/${CERT_NAME:-neutralhire}/privkey.pem;
      ssl_protocols TLSv1.2 TLSv1.3;
      ssl_prefer_server_ciphers off;
      ssl_session_cache shared:SSL:10m;
      ssl_session_timeout 1d;
      ssl_session_tickets off;

      # :80 — health check, ACME challenge, redirect to HTTPS, drop unknown hosts
      server {
        listen 80 default_server;
        location = /nginx-health { access_log off; return 200 "ok\n"; }
        location /.well-known/acme-challenge/ { root /var/www/certbot; }
        location / { return 444; }
      }
      server {
        listen 80;
        server_name ${SHOP_DOMAIN:-shop.localhost};
        location /.well-known/acme-challenge/ { root /var/www/certbot; }
        location / { return 301 https://$$host$$request_uri; }
      }

      # :443
      # Shop is the default :443 site: browsers send no SNI when you browse by IP address.
      server {
        listen 443 ssl default_server;
        http2 on;
        server_name ${SHOP_DOMAIN:-shop.localhost};
        set $$upstream ${SHOP_UPSTREAM:-http://neutralhire-ecommerce:8080};
        add_header Strict-Transport-Security "max-age=31536000" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        location ~* ^/account/login { limit_req zone=login burst=10 nodelay; proxy_pass $$upstream; include /etc/nginx/snippets/proxy.conf; }
        location / { proxy_pass $$upstream; include /etc/nginx/snippets/proxy.conf; }
      }
      # Admin panel: https://<server-ip>:<ADMIN_HTTPS_PORT> (same certificate, own port)
      server {
        listen 8443 ssl;
        http2 on;
        server_name _;
        set $$upstream ${ADMIN_UPSTREAM:-http://neutralhire-admin:8080};
        # Health probes are internal only (Docker / monitoring talk to the container directly)
        location /health/ { return 404; }
        # Restrict admin to office/VPN IPs:  allow 203.0.113.0/24;  deny all;
        add_header Strict-Transport-Security "max-age=31536000" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        location ~* ^/account/login { limit_req zone=login burst=10 nodelay; proxy_pass $$upstream; include /etc/nginx/snippets/proxy.conf; }
        location / { proxy_pass $$upstream; include /etc/nginx/snippets/proxy.conf; }
      }
